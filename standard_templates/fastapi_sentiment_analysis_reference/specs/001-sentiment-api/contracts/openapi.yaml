openapi: 3.1.0
info:
  title: Sentiment Analysis API
  version: 0.1.0
  description: >
    Contract for a FastAPI-based sentiment analysis service using the approved
    multilingual sentiment model.
servers:
  - url: http://localhost:8000
    description: Local development
paths:
  /v1/sentiment:
    post:
      summary: Analyze sentiment for a single text input
      operationId: analyzeSentiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SentimentRequest'
            examples:
              english:
                value:
                  text: "I love how quickly this service responds."
                  request_id: "req-123"
              multilingual:
                value:
                  text: "Servicio excelente, really helpful support."
      responses:
        '200':
          description: Sentiment result returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentimentResult'
              examples:
                success:
                  value:
                    request_id: req-123
                    label: positive
                    confidence: 0.98
                    model_name: tabularisai/multilingual-sentiment-analysis
                    input_size: 38
                    processed_at: "2026-03-15T00:00:00Z"
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  value:
                    request_id: req-123
                    error_code: validation_error
                    message: Request validation failed.
                    details:
                      errors:
                        - field: body.text
                          reason: Value error, Text must not be empty.
                    retryable: false
        '500':
          description: Inference or service failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                model_not_ready:
                  value:
                    request_id: req-123
                    error_code: model_not_ready
                    message: Sentiment model is not ready.
                    details: null
                    retryable: true
  /health/ready:
    get:
      summary: Check service readiness
      operationId: getReadiness
      responses:
        '200':
          description: Service is ready for traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
              examples:
                ready:
                  value:
                    status: ready
                    model_loaded: true
                    version: 0.1.0
                    checked_at: "2026-03-15T00:00:00Z"
        '503':
          description: Service is not ready for traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
              examples:
                not_ready:
                  value:
                    status: not_ready
                    model_loaded: false
                    version: 0.1.0
                    checked_at: "2026-03-15T00:00:00Z"
components:
  schemas:
    SentimentRequest:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000
          description: Single text input for sentiment analysis, limited to 5000 characters.
        language_hint:
          type: string
          minLength: 2
          maxLength: 32
          description: Optional hint for caller context; initial release does not alter core inference behavior.
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Optional caller-provided correlation identifier.
    SentimentResult:
      type: object
      required:
        - request_id
        - label
        - confidence
        - model_name
        - input_size
        - processed_at
      properties:
        request_id:
          type: string
        label:
          type: string
          enum: [positive, neutral, negative]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        model_name:
          type: string
        input_size:
          type: integer
          minimum: 1
        processed_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
        - request_id
        - error_code
        - message
        - retryable
      properties:
        request_id:
          type: string
        error_code:
          type: string
          enum:
            - validation_error
            - model_not_ready
            - inference_failed
            - internal_error
        message:
          type: string
        details:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        retryable:
          type: boolean
    ReadinessStatus:
      type: object
      required:
        - status
        - model_loaded
        - version
        - checked_at
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        model_loaded:
          type: boolean
        version:
          type: string
        checked_at:
          type: string
          format: date-time
